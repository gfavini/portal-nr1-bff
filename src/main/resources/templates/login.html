<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — Portal NR1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            padding: 2.5rem;
            width: 100%;
            max-width: 380px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #333; }
        .field { margin-bottom: 1rem; }
        label { display: block; font-size: 0.875rem; color: #555; margin-bottom: 0.35rem; }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        input:focus { outline: none; border-color: #4a90e2; box-shadow: 0 0 0 2px rgba(74,144,226,0.2); }
        .error {
            background: #fff0f0;
            border: 1px solid #f5c2c2;
            border-radius: 4px;
            color: #c0392b;
            padding: 0.6rem 0.8rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        button[type="submit"] {
            width: 100%;
            padding: 0.7rem;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        button[type="submit"]:hover { background: #357abd; }
    </style>
</head>
<body>
<div class="card">
    <h1>Portal NR1</h1>

    <div class="error" th:if="${param.error}">
        Usuário ou senha inválidos.
    </div>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="field">
            <label for="username">E-mail</label>
            <input type="text" id="username" name="username" autocomplete="username" autofocus/>
        </div>

        <div class="field">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" autocomplete="current-password"/>
        </div>

        <button type="submit">Entrar</button>
    </form>
</div>
</body>
</html>
