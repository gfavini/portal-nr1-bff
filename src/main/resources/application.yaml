spring:
  application:
    name: portal-nr1
  security:
    oauth2:
      client:
        registration:
          questionnaire-bff:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID:questionnaire-bff}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:WbE7wve89hx4JvKsoeey8jHoIstPxngX}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email,roles,offline_access
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/questionnaire-platform}
            authorization-uri: ${KEYCLOAK_AUTH_URI:http://localhost:8081/realms/questionnaire-platform/protocol/openid-connect/auth}
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8081/realms/questionnaire-platform/protocol/openid-connect/token}
            jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8081/realms/questionnaire-platform/protocol/openid-connect/certs}
            user-info-uri: ${KEYCLOAK_USERINFO_URI:http://localhost:8081/realms/questionnaire-platform/protocol/openid-connect/userinfo}
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/questionnaire-platform}


server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: Lax

cors:
  allowed-origins: http://localhost:4200
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: Authorization,Cache-Control,Content-Type,X-XSRF-TOKEN
  allow-credentials: true

keycloak:
  realm: questionnaire-platform
  auth-server-url: http://localhost:8081
  client-id: questionnaire-bff
  logout-uri: ${KEYCLOAK_LOGOUT_URI:http://localhost:8081/realms/questionnaire-platform/protocol/openid-connect/logout}
  token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8081/realms/questionnaire-platform/protocol/openid-connect/token}
  admin:
    server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://localhost:8081}
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:YV6SOenIYbrEwp5CAs6DxvDkqaGhQ2g5}
  respondent:
    role-name: ${KEYCLOAK_RESPONDENT_ROLE_NAME:RESPONDENT}

springdoc:
  swagger-ui:
    oauth:
      client-id: ${KEYCLOAK_CLIENT_ID:questionnaire-bff}
      client-secret: ${KEYCLOAK_CLIENT_SECRET:WbE7wve89hx4JvKsoeey8jHoIstPxngX}
      use-pkce-with-authorization-code-grant: true
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    org.springframework.security.oauth2: DEBUG

app:
  frontend:
    login-redirect: ${FRONTEND_LOGIN_REDIRECT:http://localhost:4200/}
    logout-redirect: ${FRONTEND_LOGOUT_REDIRECT:http://localhost:4200/login}


