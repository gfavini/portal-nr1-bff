spring:
  application:
    name: portal-nr1
  security:
    oauth2:
      client:
        registration:
          questionnaire-bff:
            provider: spring
            client-id: questionnaire-bff
            client-secret: bff-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email,roles
        provider:
          spring:
            authorization-uri: http://localhost:8080/oauth2/authorize
            token-uri: http://localhost:8080/oauth2/token
            jwk-set-uri: http://localhost:8080/oauth2/jwks
            user-info-uri: http://localhost:8080/userinfo
            user-name-attribute: sub
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/oauth2/jwks

  datasource:
    url: jdbc:postgresql://localhost:5432/portal_nr1
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always


server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: Lax

cors:
  allowed-origins: http://localhost:4200
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: Authorization,Cache-Control,Content-Type,X-XSRF-TOKEN
  allow-credentials: true


springdoc:
  swagger-ui:
    oauth:
      client-id: ${KEYCLOAK_CLIENT_ID:questionnaire-bff}
      client-secret: ${KEYCLOAK_CLIENT_SECRET:bff-secret}
      use-pkce-with-authorization-code-grant: true
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    org.springframework.security.oauth2: DEBUG

app:
  frontend:
    login-redirect: ${FRONTEND_LOGIN_REDIRECT:http://localhost:4200/}
    logout-redirect: ${FRONTEND_LOGOUT_REDIRECT:http://localhost:4200/login}


