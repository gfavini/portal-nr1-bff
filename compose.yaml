services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_DB: portal_nr1
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: admin
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U portal -d portal_nr1"]
            interval: 10s
            timeout: 5s
            retries: 5