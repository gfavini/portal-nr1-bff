          modified: 1780883298327
          sortKey: -1779040656205
          description: ""
        children:
          - url: "{{groups_endpoint}}/"
            name: LISTA GRUPOS
            meta:
              id: req_824a43cba8c641279f22307e17c5b03f
              created: 1779048105326
              modified: 1779051816013
              isPrivate: false
              description: >-
                - Purpose: List all groups with their assigned
                questionnaire/version and derived respondent counts.

                - Response: `{ groups: RespondentGroup[] }`
                  - Each group includes `respondentCount: number` (atomic counter maintained by the BFF) and `departments: string[]` (distinct department values aggregated from member respondent profiles, maintained as a StringSet on the group's metadata item — updated on every respondent create/update/transfer). Neither `respondentIds` nor `respondentEmails` are returned; fetch `GET /api/respondents?groupId=<id>` when you need the full respondent list.
                - Owner: BFF (derives `status='expired'` when `expiresAt` is in
                the past).
              sortKey: -1779048105326
            method: GET
            headers:
              - name: User-Agent
                value: insomnia/12.5.0
                description: ""
                disabled: false
            scripts:
              afterResponse: >2
                 insomnia.test('Check if status is 200', () => {
                     insomnia.expect(insomnia.response.code).to.eql(200);
                      
                     if (insomnia.response.code){
                       const jsonBody = insomnia.response.json();
                       insomnia.environment.set("group_id", jsonBody.groups[0].id);
                     }
                 });
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{groups_endpoint}}/"
            name: CRIA GRUPO
            meta:
              id: req_8dd26f29082e441ca1333b079964df28
              created: 1779048255294
              modified: 1780679820542
              isPrivate: false
              description: >-
                - Purpose: Create a group; optionally pre-assign a
                questionnaire/version. Defaults to the latest questionnaire
                version.

                - Request:
                  ```json
                  {
                    "name": "Equipe Alpha",
                    "assignedQuestionnaireId": "qre_001",
                    "assignedQuestionnaireVersion": 3,
                    "expiresAt": "2026-06-30T23:59:59.000Z",
                    "status": "open"
                  }
                  ```
                  All fields except `name` are optional.
                - Response: `{ groupId }`

                - Owner: BFF (validates single questionnaire per group; enforces
                future expiration).
              sortKey: -1779048255294
            method: POST
            body:
              mimeType: application/json
              text: >-
                {
                  "name": "Porto3",
                  "assignedQuestionnaireId": "{{ _.latest_questionnaire_id }}",
                  "assignedQuestionnaireVersion": {{latest_questionnaire_version}},
                  "expiresAt": "2026-06-23T19:21:00Z",
                  "status": "open"
                }
            headers:
              - name: Content-Type
                value: application/json
              - name: User-Agent
                value: insomnia/12.5.0
                description: ""
                disabled: false
            scripts:
              afterResponse: |2
                 insomnia.test('Check if status is 201', () => {
                     insomnia.expect(insomnia.response.code).to.eql(201);
                      
                     if (insomnia.response.code){
                       const jsonBody = insomnia.response.json();
                       insomnia.environment.set("group_id", jsonBody.id);
                     }
                 });
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{groups_endpoint}}/:id"
            name: ATUALIZA GRUPO
            meta:
              id: req_90dd7c4ebf39408eb89692817b1f9c54
              created: 1779051663386
              modified: 1779052898493
              isPrivate: false
              description: >
                - Purpose: Update group metadata or questionnaire assignment.

                - Request:
                  ```json
                  {
                    "name": "Equipe Alpha Atualizada",
                    "assignedQuestionnaireId": "qre_001",
                    "assignedQuestionnaireVersion": 3,
                    "expiresAt": "2026-12-31T23:59:59.000Z"
                  }
                  ```
                - Response: `{ group: RespondentGroup }`

                - Owner: BFF (blocks updates when group is `closed`; allows
                expired groups to reopen when a future `expiresAt` is supplied).
              sortKey: -1779051663386
            method: PUT
            body:
              mimeType: application/json
              text: >2-
                  {
                    "name": "Porto3",
                    "assignedQuestionnaireId": "{{latest_questionnaire_id }}",
                    "assignedQuestionnaireVersion": {{latest_questionnaire_version}},
                    "expiresAt": "2026-12-31T23:59:59.000Z"
